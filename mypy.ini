[mypy]
# Python version
python_version = 3.12

# Keine Ausnahmen für eigenen Code: die Reflex-Typen, die mypy dafür braucht,
# setzt scripts/patch-reflex.py (5–8).
warn_return_any = True
warn_unused_configs = True
# Eine Ausnahme, die nichts mehr unterdrückt, würde einen späteren echten Fehler
# in ihrer Zeile verdecken.
warn_unused_ignores = True
disallow_untyped_defs = False
check_untyped_defs = True

# Libraries without type stubs
[mypy-trafilatura.*]
ignore_missing_imports = True

[mypy-croniter.*]
ignore_missing_imports = True
follow_imports = skip

# google-* sind Namespace-Packages — mypy's inkrementeller Cache stolpert
# über das stub-lose "google"-Root-Modul (AssertionError "Cannot find
# module for google" beim Cache-Fixup). skip = gar nicht erst analysieren.
[mypy-google.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-googleapiclient.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-reflex.*]
ignore_missing_imports = True
