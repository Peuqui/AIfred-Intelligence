[mypy]
# Python version
python_version = 3.12

# Strict mode (aber mit Reflex-Ausnahmen)
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True

# Ignore Reflex-specific false positives
# Reflex uses special Var types that mypy doesn't understand
[mypy-aifred.aifred]
disable_error_code = attr-defined,operator

# UI-Komponenten: Reflex-Deklarativ-Code, den mypy strukturell nicht
# versteht — Var-Indexing in rx.foreach (index), Var-Vergleiche/-Negation
# (operator), Event-Handler-Referenzen als "Calls" (call-arg,
# func-returns-value), Component|Var-Rückgaben (return-value),
# State-Attribute via Klassenreferenz (attr-defined).
# arg-type/assignment bleiben AKTIV — die finden echte Schludrigkeiten.
[mypy-aifred.ui.*]
disable_error_code = index,operator,attr-defined,call-arg,func-returns-value,return-value

# State-Mixins: Cross-Mixin-Attribute existieren erst in der
# zusammengesetzten State-Klasse — für mypy unsichtbar (attr-defined),
# ebenso die Reihenfolge-Inferenz der rx.State-Felder (has-type).
# Alle anderen Codes bleiben AKTIV.
[mypy-aifred.state.*]
disable_error_code = attr-defined,has-type

# Ignore complex OpenAI type overloads in backends
[mypy-aifred.backends.vllm]
disable_error_code = call-overload

# Libraries without type stubs
[mypy-trafilatura.*]
ignore_missing_imports = True

[mypy-croniter.*]
ignore_missing_imports = True
follow_imports = skip

# google-* sind Namespace-Packages — mypy's inkrementeller Cache stolpert
# über das stub-lose "google"-Root-Modul (AssertionError "Cannot find
# module for google" beim Cache-Fixup). skip = gar nicht erst analysieren.
[mypy-google.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-googleapiclient.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-reflex.*]
ignore_missing_imports = True
