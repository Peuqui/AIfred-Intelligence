# Drop-in-Konfig fuer aifred-intelligence.service.
#
# Installation:
#   sudo mkdir -p /etc/systemd/system/aifred-intelligence.service.d/
#   sudo cp systemd/aifred-intelligence.service.d/hardening.conf \
#           /etc/systemd/system/aifred-intelligence.service.d/
#   sudo systemctl daemon-reload
#   systemctl restart aifred-intelligence.service
#
# Was diese Datei macht:
# 1. Cascade-Stop verhindern: ChromaDB-Recreate (Auto-Update 03:00) loest
#    sonst einen Mit-Stop von AIfred aus. Wants statt Requires entkoppelt.
# 2. Bun/Node Heap-Size hoch: das _index.jsx ist 793 KB gross (Modals alle
#    eager im Bundle) — Default-Heap 512 MB reicht nicht, der Frontend-
#    Prozess crasht periodisch mit SIGTERM und reisst das Backend mit.
#    Mit 4 GB ist das stabil.
# 3. Hot-Reload-Exclude erweitert: aifred_vector_cache/chroma.sqlite3 ist
#    das ChromaDB-Volume (Docker-Bind-Mount). Bei jeder Embed-Batch
#    schreibt ChromaDB hier rein. Granian's Hot-Reload (workers_kill_timeout=2)
#    sieht die Aenderung und tötet den Worker → Indexing-Job stirbt nach
#    der ersten Batch. Die Default-Ignore-Patterns enthalten .sqlite, aber
#    NICHT .sqlite3 (chroma.sqlite3) — daher hier explizit ausschliessen.

[Unit]
# Override: leere alte Requires-Liste, dann Wants neu setzen.
# Systemd setzt Requires kumulativ — explizit leeren noetig.
Requires=
Wants=ollama.service aifred-chromadb.service

[Service]
Environment="NODE_OPTIONS=--max-old-space-size=4096"
Environment="BUN_MAX_OLD_SPACE_SIZE=4096"
# Drop-Ins werden nach Service-Datei geladen → ueberschreibt das
# Environment=REFLEX_HOT_RELOAD_EXCLUDE_PATHS=data:prompts dort.
Environment="REFLEX_HOT_RELOAD_EXCLUDE_PATHS=data:prompts:aifred_vector_cache"
