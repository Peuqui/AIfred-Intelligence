# Korpus location block — fuer narnia.spdns.de:8443
# Einfuegen in /etc/nginx/sites-available/narnia (HTTPS server-Block, nahe
# der anderen location-Eintraege wie /aifred/, /haemotrace/, /ai-atc/)
#
# Reverse-proxy fuer den FastAPI-Service auf 127.0.0.1:8005
# Static UI wird unter /var/www/html/korpus/ ausgeliefert.

# Static UI
location = /korpus { return 301 /korpus/; }
location /korpus/ {
    alias /var/www/html/korpus/;
    index index.html;
    try_files $uri $uri/ /korpus/index.html;
}

# Backend API
location /korpus/api/ {
    proxy_pass http://127.0.0.1:8005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # File-Upload erlaubt grosse Multipart-Bodies
    client_max_body_size 200M;
}
