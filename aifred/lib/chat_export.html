<!DOCTYPE html>
<html lang="@@lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@@title</title>
    <!-- KaTeX CSS mit eingebetteten Fonts -->
    <style>@@katex_css</style>
    <!-- KaTeX JavaScript -->
    <script>@@katex_js</script>
    <script>@@mhchem_js</script>
    <script>@@autorender_js</script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        });
    </script>
    <style>
@@theme_css
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--aifred-page-bg);
            color: var(--aifred-text-primary);
            line-height: 1.4;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid var(--aifred-border);
            margin-bottom: 20px;
        }
        .header h1 {
            color: var(--aifred-primary);
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        .header .timestamp {
            color: var(--aifred-text-muted);
            font-size: 0.9em;
        }
        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
        }
        .message-header {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        .message-content {
            word-wrap: break-word;
        }
        /* Kompakte Abstände für Content-Elemente */
        .message-content p,
        .message-content ul,
        .message-content ol,
        .message-content table,
        .message-content details {
            margin: 0 0 1em 0;
        }
        /* Überschriften: mehr Abstand oben (Trennung), etwas Abstand unten */
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin: 0.9em 0 0.3em 0;
            color: var(--aifred-text-primary);
        }
        .message-content h2 {
            font-size: 1.3em;
            border-bottom: 1px solid var(--aifred-border);
            padding-bottom: 0.1em;
        }
        .message-content h3 {
            font-size: 1.1em;
        }
        .message-content ul, .message-content ol {
            padding-left: 1.5em;
        }
        .message-content li {
            margin: 0.1em 0;
        }
        .message-content table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.95em;
            margin: 1em 0;
        }
        .message-content table th,
        .message-content table td {
            border: 1px solid var(--aifred-border);
            padding: 8px 12px;
            text-align: left;
        }
        .message-content table th {
            background-color: var(--aifred-input-bg);
            font-weight: bold;
            color: var(--aifred-text-primary);
        }
        .message-content table tr:nth-child(even) {
            background-color: color-mix(in srgb, var(--aifred-border) 30%, transparent);
        }
        /* Embedded chat images */
        .chat-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .chat-image:hover {
            transform: scale(1.02);
        }
        /* User: box with border */
        .user-message {
            background-color: var(--aifred-input-bg);
            border: 1px solid var(--aifred-border);
            text-align: right;
            padding-right: 85px;
        }
        .user-message .chat-image {
            float: right;
            clear: both;
            margin-left: 10px;
        }
        .user-message .message-header {
            color: var(--aifred-user-name);
            text-align: right;
            margin-right: -70px;
        }
        /* An agent's reply: box with border + left accent */
        .agent-message {
            background-color: var(--aifred-card-bg);
            border: 1px solid var(--aifred-border);
            border-left: 3px solid var(--aifred-primary);
        }
        .agent-message .message-header {
            color: var(--aifred-primary);
        }
        .summary-message {
            background-color: var(--aifred-card-bg);
            border-left: 3px solid var(--aifred-text-muted);
        }
        .summary-message .message-header {
            color: var(--aifred-text-muted);
        }
        /* Audio player styling */
        .message-audio {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--aifred-border);
        }
        .message-audio audio {
            width: 100%;
            max-width: 400px;
            height: 36px;
            border-radius: 8px;
        }
        /* Collapsible details styling */
        details {
            border: 1px solid var(--aifred-border);
            border-radius: 6px;
            background-color: var(--aifred-page-bg);
        }
        summary {
            cursor: pointer;
            padding: 8px;
            font-weight: bold;
            color: var(--aifred-text-muted);
            background-color: var(--aifred-card-bg);
            border-radius: 6px 6px 0 0;
        }
        summary:hover {
            background-color: var(--aifred-input-bg);
        }
        details[open] summary {
            border-bottom: 1px solid var(--aifred-border);
            border-radius: 6px 6px 0 0;
        }
        details > div {
            padding: 8px;
        }
        .thinking-compact {
            color: var(--aifred-text-secondary);
            font-size: 0.9em;
            line-height: 1.3;
        }
        .thinking-compact p {
            margin: 0.3em 0;
        }
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--aifred-border);
            margin-top: 20px;
            color: var(--aifred-text-muted);
            font-size: 0.85em;
        }
        .footer a {
            color: var(--aifred-accent-cyan);
            text-decoration: underline;
        }
        .footer a:hover {
            color: var(--aifred-accent-cyan);
        }
        /* Global link styling (for embedded content) */
        a {
            color: var(--aifred-accent-cyan);
            text-decoration: underline;
        }
        a:hover {
            color: var(--aifred-accent-cyan);
        }
        /* Italic text (normal markdown *text*) */
        em {
            font-style: italic;
            color: inherit;
        }
        /* Metrics styling (wrapped in .metrics class) */
        .metrics {
            color: var(--aifred-text-muted);
            font-style: normal;
            font-size: 0.85em;
            display: block;
            margin-top: 8px;
        }
        /* Code blocks */
        pre, code {
            background-color: var(--aifred-card-bg);
            border-radius: 4px;
            font-family: 'Courier New', Consolas, monospace;
        }
        pre {
            padding: 8px;
            overflow-x: auto;
            margin: 0.3em 0;
        }
        code {
            padding: 2px 5px;
        }
        /* Tables (from markdown) */
        th, td {
            border: 1px solid var(--aifred-border);
            padding: 6px 10px;
            text-align: left;
        }
        th {
            background-color: var(--aifred-input-bg);
            font-weight: bold;
            color: var(--aifred-text-primary);
        }
        tr:nth-child(even) {
            background-color: var(--aifred-card-bg);
        }
        tr:hover {
            background-color: var(--aifred-input-bg);
        }
        /* Bold and italic */
        strong {
            color: var(--aifred-text-primary);
        }
        /* KaTeX Block-Formeln zentrieren */
        .katex-display {
            margin: 0.5em 0;
        }
        /* Screen-only toolbar: expand/collapse all collapsibles. Handy before
           a manual "Save as PDF" on browsers that don't fire beforeprint
           (e.g. Firefox mobile). Hidden in the printed output. */
        .export-toolbar {
            text-align: center;
            margin-bottom: 16px;
        }
        .export-toolbar button {
            background: var(--aifred-input-bg);
            color: var(--aifred-accent-blue);
            border: 1px solid var(--aifred-border);
            border-radius: 6px;
            padding: 8px 14px;
            margin: 0 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .export-toolbar button:hover {
            background: var(--aifred-border);
        }
        /* Print / PDF: light background (saves ink + readable on paper) and —
           crucially — expand every <details> so the web-source URLs and
           thinking blocks actually land in the generated PDF. A closed
           <details> is otherwise omitted from print. The toolbar is dropped. */
        @media print {
            body {
                background: var(--aifred-text-on-accent);
                color: var(--aifred-page-bg);
            }
            .header, .footer {
                border-color: var(--aifred-text-soft);
            }
            .header h1 {
                color: var(--aifred-primary);
            }
            .message,
            .agent-message,
            .user-message, .summary-message {
                background: var(--aifred-text-on-accent) !important;
                border: 1px solid var(--aifred-text-soft) !important;
            }
            details, summary {
                background: var(--aifred-text-on-accent) !important;
                color: var(--aifred-border) !important;
            }
            details > *:not(summary) {
                display: block !important;
            }
            a {
                color: var(--aifred-accent-blue) !important;
            }
            .export-toolbar {
                display: none !important;
            }
        }
    </style>
    <script>
        // Expand all collapsibles before printing so the web-source URLs and
        // thinking blocks land in the PDF, then restore the previously-closed
        // ones afterwards (keeps the on-screen view tidy). Browsers that don't
        // fire beforeprint (e.g. Firefox mobile) fall back to the @media print
        // CSS above and the manual toolbar buttons below.
        window.addEventListener('beforeprint', function() {
            document.querySelectorAll('details').forEach(function(d) {
                if (!d.open) { d.setAttribute('data-was-closed', '1'); d.open = true; }
            });
        });
        window.addEventListener('afterprint', function() {
            document.querySelectorAll('details[data-was-closed]').forEach(function(d) {
                d.open = false; d.removeAttribute('data-was-closed');
            });
        });
    </script>
</head>
<body>
    <div class="header">
        <h1>🎩 AIfred Intelligence</h1>
        <div class="timestamp">@@subtitle</div>
    </div>
    <div class="export-toolbar">
        <button onclick="document.querySelectorAll('details').forEach(function(d){d.open=true;})">@@expand_label</button>
        <button onclick="document.querySelectorAll('details').forEach(function(d){d.open=false;})">@@collapse_label</button>
    </div>
@@messages
    <div class="footer">
        <p>@@exported_from <a href="https://github.com/Peuqui/AIfred-Intelligence" target="_blank">AIfred Intelligence</a></p>
        <p>@@tagline</p>
    </div>
</body>
</html>
