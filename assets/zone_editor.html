<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigilantia</title>
<!--I18N-->
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --accent:#FFA500; --text:#e6e6e6; --muted:#9aa3b2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; color:var(--accent); font-weight:600; }
  header .src { color:var(--muted); font-size:12px; font-family:monospace; }
  .wrap { padding:16px; }
  .controls { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 14px; }
  .controls label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .controls input[type=range] { accent-color: var(--accent); }
  .controls input[type=checkbox] { accent-color: var(--accent); width:16px; height:16px; }
  .controls .seg { display:flex; gap:8px; }
  button { background:#23272f; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:#3d2a00; color:var(--accent); border-color:var(--accent); font-weight:600; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  /* Responsiv: skaliert mit der Fensterbreite, aber nie über die native
     Auflösung hinaus (max 100%). Die interne Canvas-Auflösung bleibt fix;
     evtPos() rechnet die Mauskoordinaten über getBoundingClientRect um, das
     Malen bleibt also bei jeder Anzeigegröße exakt. */
  #stage { position:relative; display:block; width:100%; max-width:900px; border:1px solid var(--border); border-radius:8px; overflow:hidden; line-height:0; background:#000; }
  #live { display:block; width:100%; height:auto; }
  #cv { position:absolute; top:0; left:0; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  #status { margin-top:10px; font-size:13px; min-height:18px; }
  #status.ok { color:#4caf50; } #status.err { color:#ff6b6b; }
  kbd { background:#23272f; border:1px solid var(--border); border-radius:3px; padding:1px 5px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="zone_editor_title"></h1>
  <span class="src" id="srcLabel"></span>
</header>
<div class="wrap">
  <div class="controls">
    <div class="seg">
      <label><input type="radio" name="brush" value="1" checked> <span data-i18n="zone_editor_mode_motion"></span></label>
      <label><input type="radio" name="brush" value="2"> <span data-i18n="zone_editor_mode_blackout"></span></label>
      <label><input type="radio" name="brush" value="3"> <span data-i18n="zone_editor_mode_roi"></span></label>
    </div>
    <label><input type="checkbox" id="active" checked> <span data-i18n="zone_editor_active"></span></label>
    <label><span data-i18n="zone_editor_brush"></span> <input type="range" id="brush" min="1" max="10" value="3"> <span id="brushVal">3</span></label>
    <label><span data-i18n="zone_editor_grid"></span> <input type="range" id="grid" min="16" max="96" step="8" value="48"> <span id="gridVal"></span></label>
    <button id="reload" data-i18n="zone_editor_reload"></button>
    <button id="clear" data-i18n="zone_editor_clear"></button>
    <button class="primary" id="save" data-i18n="zone_editor_save"></button>
  </div>
  <div class="hint" data-i18n-html="zone_editor_hint"></div>
  <div id="stage">
    <img id="live" width="900" height="506" alt="">
    <canvas id="cv" width="900" height="506"></canvas>
  </div>
  <div id="status"></div>
</div>
<script>
(function () {
  "use strict";
  const T = window.T || {};
  const tr = (k) => (T[k] !== undefined ? T[k] : k);

  function applyI18n() {
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = tr(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => {
      el.innerHTML = tr(el.getAttribute("data-i18n-html"));
    });
    document.title = tr("zone_editor_title");
  }
  applyI18n();

  const params = new URLSearchParams(location.search);
  const sourceId = params.get("source_id") || "";
  document.getElementById("srcLabel").textContent = sourceId;

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const live = document.getElementById("live");
  const statusEl = document.getElementById("status");
  const brushEl = document.getElementById("brush");
  const brushValEl = document.getElementById("brushVal");
  const gridEl = document.getElementById("grid");
  const gridValEl = document.getElementById("gridVal");
  const activeEl = document.getElementById("active");

  const MAX_W = 900;
  let img = new Image();
  let imgReady = false;
  let cols = parseInt(gridEl.value, 10);
  let rows = 27;
  let mask = [];
  let painting = false;
  let paintValue = 1;

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = kind || "";
  }

  function newMask() {
    mask = [];
    for (let r = 0; r < rows; r++) mask.push(new Array(cols).fill(0));
  }

  function recomputeRows() {
    const ar = (imgReady && img.naturalWidth) ? img.naturalHeight / img.naturalWidth : 9 / 16;
    rows = Math.max(4, Math.round(cols * ar));
  }

  function updateGridLabel() {
    gridValEl.textContent = cols + "×" + rows;  // z.B. "48×27"
  }

  function selectedBrush() {
    const el = document.querySelector('input[name="brush"]:checked');
    return el ? parseInt(el.value, 10) : 1;
  }

  function colorFor(v) {
    if (v === 1) return "rgba(255,80,80,0.45)";  // ignorieren = rot
    if (v === 2) return "rgba(0,0,0,0.55)";       // schwärzen = fast schwarz
    if (v === 3) return "rgba(0,220,90,0.40)";    // ROI = grün
    return null;
  }

  function render() {
    // Canvas ist transparent — der Live-MJPEG-Stream darunter scheint
    // durch; wir zeichnen nur Maske + Raster.
    ctx.clearRect(0, 0, cv.width, cv.height);
    const cw = cv.width / cols, ch = cv.height / rows;
    // Jede Zelle in der Farbe ihres Typs (rot/schwarz/grün) — transparent
    // genug, dass das Live-Bild durchscheint.
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const v = mask[r][c];
        if (!v) continue;
        ctx.fillStyle = colorFor(v);
        ctx.fillRect(c * cw, r * ch, cw + 0.5, ch + 0.5);
      }
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= cols; c++) { ctx.moveTo(c * cw, 0); ctx.lineTo(c * cw, cv.height); }
    for (let r = 0; r <= rows; r++) { ctx.moveTo(0, r * ch); ctx.lineTo(cv.width, r * ch); }
    ctx.stroke();
  }

  function paintAt(px, py, value) {
    const cw = cv.width / cols, ch = cv.height / rows;
    const cc = Math.floor(px / cw), cr = Math.floor(py / ch);
    const R = parseInt(brushEl.value, 10) - 1;
    for (let dr = -R; dr <= R; dr++)
      for (let dc = -R; dc <= R; dc++) {
        if (dr * dr + dc * dc > R * R) continue;
        const r = cr + dr, c = cc + dc;
        if (r >= 0 && r < rows && c >= 0 && c < cols) mask[r][c] = value;
      }
    render();
  }

  function evtPos(e) {
    const rect = cv.getBoundingClientRect();
    return [
      (e.clientX - rect.left) * (cv.width / rect.width),
      (e.clientY - rect.top) * (cv.height / rect.height),
    ];
  }

  cv.addEventListener("contextmenu", (e) => e.preventDefault());
  cv.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    painting = true;
    paintValue = (e.button === 2) ? 0 : selectedBrush();
    cv.setPointerCapture(e.pointerId);
    const [x, y] = evtPos(e); paintAt(x, y, paintValue);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!painting) return;
    const [x, y] = evtPos(e); paintAt(x, y, paintValue);
  });
  const endPaint = () => { painting = false; };
  cv.addEventListener("pointerup", endPaint);
  cv.addEventListener("pointercancel", endPaint);

  brushEl.addEventListener("input", () => { brushValEl.textContent = brushEl.value; });
  // Aktiv-Toggle: speichert sofort → Live-Reload, schnelle Gegenprobe.
  activeEl.addEventListener("change", () => { save(); });
  gridEl.addEventListener("change", () => {
    cols = parseInt(gridEl.value, 10);
    recomputeRows();
    updateGridLabel();
    newMask();
    render();
    setStatus(tr("zone_editor_grid_changed"), "");
  });

  document.getElementById("clear").addEventListener("click", () => {
    newMask(); render(); setStatus(tr("zone_editor_cleared"), "");
  });
  document.getElementById("reload").addEventListener("click", loadImage);
  document.getElementById("save").addEventListener("click", save);

  function maskToCells() {
    let s = "";
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) s += String(mask[r][c] || 0);
    return s;
  }

  async function save() {
    const cells = maskToCells();
    const hasAny = /[^0]/.test(cells);
    const payload = {
      source_id: sourceId,
      cols: cols, rows: rows, cells: cells,
      enabled: activeEl.checked,
    };
    setStatus(tr("zone_editor_saving"), "");
    try {
      const res = await fetch("/api/vision/zone-mask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      setStatus(
        hasAny
          ? (activeEl.checked ? tr("zone_editor_saved") : tr("zone_editor_saved_off"))
          : tr("zone_editor_removed"),
        "ok");
    } catch (err) {
      setStatus(tr("zone_editor_save_failed") + err.message, "err");
    }
  }

  function sizeStage(w, h) {
    cv.width = w; cv.height = h;
    live.width = w; live.height = h;
  }

  function loadImage() {
    setStatus(tr("zone_editor_loading"), "");
    img = new Image();
    img.onload = () => {
      imgReady = true;
      sizeStage(MAX_W, Math.round(MAX_W * img.naturalHeight / img.naturalWidth));
      recomputeRows();
      updateGridLabel();
      if (!mask.length || mask.length !== rows) newMask();
      live.src = "/api/vision/stream/" + sourceId + "?fps=4&t=" + Date.now();
      render();
      setStatus(tr("zone_editor_live"));
    };
    img.onerror = () => {
      imgReady = false;
      live.removeAttribute("src");
      sizeStage(MAX_W, Math.round(MAX_W * 9 / 16));
      recomputeRows();
      updateGridLabel();
      if (!mask.length) newMask();
      render();
      setStatus(tr("zone_editor_offline"), "err");
    };
    img.src = "/api/vision/snapshot/" + sourceId + "?t=" + Date.now();
  }

  async function loadExisting() {
    try {
      const res = await fetch("/api/vision/zone-mask?source_id=" + encodeURIComponent(sourceId));
      const d = await res.json();
      if (d && d.exists && d.cells && d.cols && d.rows && d.cells.length === d.cols * d.rows) {
        cols = d.cols; rows = d.rows;
        gridEl.value = Math.min(96, Math.max(16, Math.round(cols / 8) * 8));
        newMask();
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++) {
            const v = parseInt(d.cells[r * cols + c], 10);
            mask[r][c] = (v >= 1 && v <= 3) ? v : 0;
          }
        activeEl.checked = (d.enabled !== false);
      }
    } catch (e) { /* keine bestehende Maske — egal */ }
  }

  if (!sourceId) { setStatus(tr("zone_editor_no_source"), "err"); return; }
  brushValEl.textContent = brushEl.value;
  updateGridLabel();
  loadExisting().then(loadImage);
})();
</script>
</body>
</html>
