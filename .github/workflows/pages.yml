name: Deploy GitHub Pages

# Übersteuert den GitHub-eigenen Auto-Pages-Build. Triggert nur bei
# Änderungen unter docs/ — keine Build-Failure-Mails mehr, wenn sich
# nur AIfred-Code (außerhalb docs/) ändert.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Mehrere parallele Pages-Deployments verhindern; bei laufendem Build
# wird er nicht abgebrochen, der neue wartet bis er dran ist.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
