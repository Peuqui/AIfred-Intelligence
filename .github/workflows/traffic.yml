name: Persist GitHub Traffic Data

on:
  schedule:
    - cron: '0 1 * * *'  # Täglich um 01:00 UTC
  workflow_dispatch:  # Manuell auslösbar

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and persist traffic data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          # Kein Fallback auf Ersatzwerte: Ein gescheiterter Abruf soll den
          # Lauf rot färben, statt still eine 0 in die Historie zu schreiben.
          # "0 Sterne" ist eine inhaltliche Aussage, kein "nicht gemessen" —
          # und war zweimal (u.a. 2026-03-30) als Phantom-Einbruch in der
          # Kurve zu sehen. Eine fehlende Zeile ist ehrlicher; die
          # Traffic-Daten holt das 14-Tage-Fenster am Folgetag ohnehin nach.
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%d)
          REPO="${{ github.repository }}"

          mkdir -p .github/traffic

          # Traffic-Daten abrufen (stderr bleibt sichtbar — im Fehlerfall
          # steht die Ursache im Action-Log)
          VIEWS=$(gh api "repos/$REPO/traffic/views")
          CLONES=$(gh api "repos/$REPO/traffic/clones")
          REFERRERS=$(gh api "repos/$REPO/traffic/popular/referrers")
          PATHS=$(gh api "repos/$REPO/traffic/popular/paths")

          # Stars und Forks abrufen
          STARS=$(gh api "repos/$REPO" --jq '.stargazers_count')
          FORKS=$(gh api "repos/$REPO" --jq '.forks_count')

          # Tages-Snapshot als JSONL — -c schreibt eine Zeile pro Tag und
          # macht die Datei zu dem echten JSONL, das ihr Name behauptet.
          # Zuvor gab jq mehrzeilig aus, weshalb der Duplikat-Check unten
          # nie gegriffen hat.
          SNAPSHOT=$(jq -nc \
            --arg date "$DATE" \
            --argjson views "$VIEWS" \
            --argjson clones "$CLONES" \
            --argjson referrers "$REFERRERS" \
            --argjson paths "$PATHS" \
            --argjson stars "$STARS" \
            --argjson forks "$FORKS" \
            '{date: $date, views: $views, clones: $clones, referrers: $referrers, paths: $paths, stars: $stars, forks: $forks}')

          # Duplikat-Check (nicht doppelt speichern wenn am selben Tag nochmal
          # läuft). Das optionale Leerzeichen im Muster deckt beide Formate ab:
          # die Altbestände sind mehrzeilig-eingerückt, neue Zeilen kompakt.
          if grep -qE "\"date\": ?\"$DATE\"" .github/traffic/traffic.jsonl; then
            echo "Data for $DATE already exists, skipping."
          else
            echo "$SNAPSHOT" >> .github/traffic/traffic.jsonl
            echo "Added traffic data for $DATE"
          fi

      # Zeitstempel der einzelnen Sterne, aggregiert auf Tage und OHNE
      # Benutzernamen — genau die personenbezogenen Daten, wegen derer
      # GitHub die API am 30.06.2026 gesperrt hat, gehören nicht in ein
      # öffentliches Repo. Als Repo-Admin liefert die API sie weiterhin.
      # Reicht bis zum ersten Stern zurück und schließt damit die Lücke
      # vor Messbeginn (die Snapshots starten erst im Februar).
      - name: Refresh star timestamps
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          CREATED=$(gh api "repos/$REPO" --jq '.created_at' | cut -dT -f1)
          # --slurp verträgt sich nicht mit --jq, deshalb die Aggregation
          # in einer nachgelagerten jq-Pipe. Ohne --slurp käme pro Seite ein
          # eigenes JSON-Array, was ab 100 Sternen auseinanderfliegt.
          DAILY=$(gh api "repos/$REPO/stargazers" --paginate --slurp \
                    -H "Accept: application/vnd.github.star+json" \
                  | jq 'add | [.[].starred_at | split("T")[0]]
                        | group_by(.) | map({key: .[0], value: length}) | from_entries')

          # Erst in eine Temp-Datei: Ein fehlgeschlagener Abruf darf die
          # vorhandene Historie nicht durch eine leere Datei ersetzen.
          jq -n --arg created "$CREATED" --argjson daily "$DAILY" \
            '{repo_created: $created, daily_stars: $daily}' \
            > .github/traffic/stars-daily.json.tmp
          mv .github/traffic/stars-daily.json.tmp .github/traffic/stars-daily.json

      # Ersetzt die star-history.com-Einbindung, die seit der API-Sperre
      # ohne Token mit Schreibrechten nicht mehr funktioniert.
      - name: Render star history chart
        run: python3 .github/scripts/render_star_history.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/traffic/
          git diff --cached --quiet || git commit -m "chore: update traffic data ($(date -u +%Y-%m-%d))"
          git push
