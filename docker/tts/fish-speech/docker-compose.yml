services:
  fish-speech:
    image: fish-speech-s2-pro
    build: .
    container_name: fish-speech
    restart: "no"  # AIfred controls container lifecycle (like XTTS / MOSS / Qwen3)
    ports:
      # Port convention: XTTS=5051, Qwen3=5052, FishSpeech=5053, MOSS=5055
      # (5054 still reserved for a future engine — keeps the block tidy).
      - "5053:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${TTS_GPU_UUID}']
              capabilities: [gpu]
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=${TTS_GPU_UUID}
      - CUDA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=0  # allow first-run download; once cached, the entrypoint short-circuits

      # torch.compile gives ~10× speed-up but adds ~2-3 min compile time
      # to the first request. Turn off (COMPILE=0) for debugging.
      - COMPILE=${FISH_SPEECH_COMPILE:-1}

      # Persist the torch.compile (Inductor) + Triton kernel caches in a
      # named volume so the ~2-3 min compile only happens ONCE, not on
      # every container start. Cache is GPU-arch + torch-version
      # specific — a GPU change or image rebuild simply triggers a
      # one-time recompile, no error.
      - TORCHINDUCTOR_CACHE_DIR=/app/compile-cache/inductor
      - TRITON_CACHE_DIR=/app/compile-cache/triton

      # ── Auto-shutdown after N minutes idle (parity with XTTS / MOSS /
      # Qwen3-TTS). aifred_idle_server.py runs the watchdog: it frees the
      # ~20 GB GPU VRAM when Fish-Speech sits unused. 0 disables it.
      - FISH_SPEECH_KEEP_ALIVE=${FISH_SPEECH_KEEP_ALIVE:-45}

    volumes:
      # Model weights — persistent named volume so the ~8 GB download
      # survives image rebuilds.
      - fish_speech_checkpoints:/app/checkpoints
      # Reference voices for cloning — same AIfred / HAL9000 / Salomo /
      # Sokrates set we use elsewhere. Read-only mount.
      - ../voices:/app/references:ro
      # torch.compile / Triton kernel cache — persists across container
      # restarts so the compile cost is paid once, not every boot.
      - fish_speech_compile_cache:/app/compile-cache

    healthcheck:
      # Upstream exposes /v1/health (returns 200 once the model has
      # finished loading). First start does the ~8 GB weight pull, so
      # we give it a long start_period.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

volumes:
  fish_speech_checkpoints:
    name: fish_speech_checkpoints
  fish_speech_compile_cache:
    name: fish_speech_compile_cache
