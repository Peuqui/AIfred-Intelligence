services:
  # ChromaDB Vector Cache (Essential - always needed)
  chromadb:
    image: chromadb/chroma:latest
    container_name: aifred-chromadb
    ports:
      # Bind to loopback only: AIfred runs on the host and reaches ChromaDB via
      # localhost:8000. Container↔container traffic uses the internal bridge
      # network (service name), NOT the published port — so loopback binding
      # does not break anything but keeps the unauthenticated vector DB off the LAN.
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent storage on host filesystem.
      # ACHTUNG: chromadb/chroma:latest hat den Default-Persist-Path im Mai
      # 2026 von /chroma/chroma auf /data geändert. Mount muss zum aktuellen
      # Default passen, sonst persistiert der Container nach /data IM Container
      # und alles geht beim nächsten Image-Recreate (docker-auto-update.sh
      # 03:00 Cron) verloren.
      - ../aifred_vector_cache:/data
    environment:
      # Disable telemetry for privacy
      - ANONYMIZED_TELEMETRY=False
      # ALLOW_RESET=True erlaubt destruktive client.reset() — gefährlich für
      # produktive User-Daten. False schaltet das Tool chromadb_clear() ab,
      # falls man je versehentlich darauf klickt. Auf True nur stellen wenn
      # man bewusst eine Test-Instanz möchte.
      - ALLOW_RESET=False
      # Persist-Path explizit setzen — defensiv gegen weitere Default-Drifts
      # in zukünftigen Image-Versionen. Muss zum Volume-Mount-Ziel passen.
      - PERSIST_DIRECTORY=/data
      - IS_PERSISTENT=True
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - aifred-network

  # SearXNG Search Engine (Optional - for web research)
  searxng:
    image: searxng/searxng:latest
    container_name: aifred-searxng
    restart: unless-stopped
    ports:
      # Loopback only — AIfred reaches SearXNG via localhost:8888 for web
      # research; no remote consumer. Keeps the internal search instance off the LAN.
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-$(openssl rand -hex 32)}
    networks:
      - aifred-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - full  # Only start with: docker-compose --profile full up -d

networks:
  aifred-network:
    driver: bridge
